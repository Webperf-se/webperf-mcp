name: Release

# Tag a commit `vX.Y.Z` (matching __init__.py and manifest.json) and this
# packs the bundle and attaches it to a GitHub release, so the README's
# "latest release" link always resolves to a tested artifact.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Tag matches package and manifest
        run: python3 tools/check_versions.py "${GITHUB_REF_NAME}"
      - name: Tests pass on the tagged commit
        run: |
          python -m pip install -e ".[dev]"
          ruff check .
          pytest
      - name: Lockfile current
        run: uv lock --check
      - name: Pack bundle
        run: |
          npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
          mkdir -p dist
          npx --yes @anthropic-ai/mcpb@2.1.2 pack . "dist/webperf-mcp-${GITHUB_REF_NAME#v}.mcpb"
          ! unzip -l dist/*.mcpb | grep -E '\.env|\.venv/|__pycache__|\.git/'
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*.mcpb
          generate_release_notes: true
