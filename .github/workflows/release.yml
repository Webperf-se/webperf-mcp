name: Release

# Tag a commit `vX.Y.Z` (matching __init__.py and manifest.json) and this
# packs the bundle and attaches it to a GitHub release, so the README's
# "latest release" link always resolves to a tested artifact.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Tag matches package and manifest
        run: python3 tools/check_versions.py "${GITHUB_REF_NAME}"
      - name: Tests pass on the tagged commit
        run: |
          python -m pip install -e ".[dev]"
          ruff check .
          pytest
      - name: Lockfile current
        run: uv lock --check
      - name: Pack bundle
        run: |
          npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
          mkdir -p dist
          npx --yes @anthropic-ai/mcpb@2.1.2 pack . "dist/webperf-mcp-${GITHUB_REF_NAME#v}.mcpb"
          ! unzip -l dist/*.mcpb | grep -E '\.env|\.venv/|__pycache__|\.git/'
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*.mcpb
          generate_release_notes: true
