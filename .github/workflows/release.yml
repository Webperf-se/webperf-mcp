name: Release

# Tag a commit `vX.Y.Z` (matching __init__.py and manifest.json) and this
# packs the bundle and attaches it to a GitHub release, so the README's
# "latest release" link always resolves to a tested artifact.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Tag matches package and manifest
        run: python3 tools/check_versions.py "${GITHUB_REF_NAME}"
      - name: Tests pass on the tagged commit
        run: |
          python -m pip install -e ".[dev]"
          ruff check .
          pytest
      - name: Lockfile current
        run: uv lock --check
      - name: Pack bundle
        run: |
          npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
          mkdir -p dist
          npx --yes @anthropic-ai/mcpb@2.1.2 pack . "dist/webperf-mcp-${GITHUB_REF_NAME#v}.mcpb"
          ! unzip -l dist/*.mcpb | grep -E '\.env|\.venv/|__pycache__|\.git/'
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*.mcpb
          generate_release_notes: true
