name: CI

# Nothing here writes to the repo; the release workflow is the only job that
# needs more than read access.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new upstream mcp release that breaks a fresh install is
    # noticed even when nobody is committing.
    - cron: "17 6 * * 1"

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install from a clean environment
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit and stdio tests
        run: pytest

  bundle:
    name: bundle (uv lock, manifest, pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Lockfile is committed and current
        run: uv lock --check
      - name: Boot the server the way the .mcpb does
        run: |
          uv sync --frozen
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}\n' \
            | WEBPERF_API_KEY= timeout 60 uv run --frozen --directory . src/webperf_mcp/server.py \
            | grep -q '"serverInfo"'
      - name: Versions agree
        run: python3 tools/check_versions.py
      - name: Validate manifest
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
      - name: Pack bundle
        run: |
          mkdir -p dist
          npx --yes @anthropic-ai/mcpb@2.1.2 pack . dist/webperf-mcp.mcpb
      - name: Bundle contains no secrets or junk
        run: |
          unzip -l dist/webperf-mcp.mcpb
          ! unzip -l dist/webperf-mcp.mcpb | grep -E '\.env|\.venv/|__pycache__|\.git/'
          unzip -l dist/webperf-mcp.mcpb | grep -q uv.lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webperf-mcp.mcpb
          path: dist/webperf-mcp.mcpb
